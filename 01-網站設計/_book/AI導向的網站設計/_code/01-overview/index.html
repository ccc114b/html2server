<!DOCTYPE html>
<html>
<head>
    <title>我的簡易網誌</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; line-height: 1.6; }
        .post { border-bottom: 1px solid #ddd; padding: 10px 0; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>✍️ 新增網誌</h2>
    <input id="title" placeholder="文章標題">
    <textarea id="content" placeholder="內容..."></textarea>
    <button onclick="publish()">發布文章</button>

    <h2>📜 文章列表</h2>
    <div id="post-list"></div>

    <script>
        // 1. 從後端抓資料並顯示
        async function loadPosts() {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const list = document.getElementById('post-list');
            list.innerHTML = posts.map(p => `
                <div class="post">
                    <h3>${p.title}</h3>
                    <p>${p.content}</p>
                </div>
            `).join('');
        }

        // 2. 把新文章傳給後端
        async function publish() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content })
            });
            
            loadPosts(); // 重新整理列表
        }

        loadPosts(); // 網頁開啟時先讀取一次
    </script>
</body>
</html>
